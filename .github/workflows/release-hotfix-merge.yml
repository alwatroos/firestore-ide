name: Release – Fix (patch bump) – On Merge

# Triggered automatically when a PR from a HOTFIX/* branch is merged into main.
# Reads the version already bumped on the HOTFIX branch, creates a tag, publishes a
# GitHub Release, builds installers, and back-merges main into develop.

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag, create release & back-merge
    # Only run when the PR was actually merged (not just closed) and it came from a HOTFIX branch.
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'HOTFIX/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read version from package.json
        id: version
        run: |
          version=$(jq -r '.version' package.json)
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Back-merge main into develop
        run: |
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge --no-ff main \
            -m "chore(release): back-merge ${{ steps.version.outputs.tag }} into develop"
          git push origin develop

      - name: Delete HOTFIX branch
        run: git push origin --delete "${{ github.event.pull_request.head.ref }}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

  build:
    name: Build ${{ matrix.os }}
    needs: release
    # Skip if the release job was skipped (PR closed without merging, or not a HOTFIX branch).
    if: needs.release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: dist/*.AppImage
            csc_auto_discovery: 'false'
          - os: windows-latest
            artifacts: dist/*.exe
            csc_auto_discovery: 'false'
          - os: macos-latest
            artifacts: dist/*.dmg
            csc_auto_discovery: 'true'
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.csc_auto_discovery }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: ${{ matrix.artifacts }}
