name: Release – Regular (minor bump)

# Manual trigger only. Creates a RELEASE/{version} branch from develop, bumps the
# minor version, merges it into main with a merge commit, tags, publishes a GitHub
# Release, builds installers, then back-merges into develop.
#
# Requirements:
# - A `develop` branch must exist.
# - The GitHub Actions bot must be able to push directly to `main` and `develop`
#   (disable push-protection rules for those branches, or supply a PAT via secrets.BOT_TOKEN).

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump minor, merge to main & tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump minor version
        id: bump
        run: |
          new=$(npm version minor --no-git-tag-version)
          echo "tag=${new}" >> "$GITHUB_OUTPUT"
          echo "version=${new#v}" >> "$GITHUB_OUTPUT"

      - name: Create RELEASE branch and push version bump
        run: |
          git checkout -b "RELEASE/${{ steps.bump.outputs.version }}"
          git add package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git push origin "RELEASE/${{ steps.bump.outputs.version }}"

      - name: Merge RELEASE branch into main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff "RELEASE/${{ steps.bump.outputs.version }}" \
            -m "chore(release): merge RELEASE/${{ steps.bump.outputs.version }} into main"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Back-merge main into develop
        run: |
          git checkout -B develop origin/develop
          git merge --no-ff main \
            -m "chore(release): back-merge ${{ steps.bump.outputs.tag }} into develop"
          git push origin develop

      - name: Delete RELEASE branch
        run: git push origin --delete "RELEASE/${{ steps.bump.outputs.version }}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true

  build:
    name: Build ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: dist/*.AppImage
            csc_auto_discovery: 'false'
          - os: windows-latest
            artifacts: dist/*.exe
            csc_auto_discovery: 'false'
          - os: macos-latest
            artifacts: dist/*.dmg
            csc_auto_discovery: 'true'
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.csc_auto_discovery }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: ${{ matrix.artifacts }}
