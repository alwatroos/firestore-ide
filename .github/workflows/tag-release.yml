name: Tag release

# One-click release. The owner runs Actions -> Tag release on `main` and picks the bump (patch by default).
# This workflow checks the head of main (lint, typecheck, tests), bumps the version in package.json, commits
# "chore(release): vX.Y.Z" to main, pushes the tag `vX.Y.Z` and dispatches `release.yml` on that tag, which builds,
# signs and notarises macOS, signs update.json and publishes the GitHub Release.
#
# A push made with GITHUB_TOKEN does not start the `push: tags` trigger of release.yml (GitHub blocks recursive
# triggers), so the tag run is started with a dispatch on the tag ref instead.
#
# Every input reaches a script through `env:` only; no expression is interpolated into a `run:` script.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version instead of the bump, for example 1.0.0 (optional)"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: tag release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm exec biome ci .
          pnpm typecheck
          pnpm test

      - name: Bump version
        id: bump
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' ||
              { echo "::error title=Version::'$VERSION' is not X.Y.Z[-pre]"; exit 1; }
            target=$VERSION
          else
            target=$BUMP
          fi
          version=$(npm version "$target" --no-git-tag-version | sed 's/^v//')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error title=Version::the tag $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Commit, tag and push
        shell: bash
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Dispatch Release
        shell: bash
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          {
            echo "## Tag release $TAG"
            echo "Release run: https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml"
          } >>"$GITHUB_STEP_SUMMARY"
