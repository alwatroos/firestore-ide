name: Release

# Release pipeline: electron-builder (`pnpm dist`) builds the installers on ubuntu, windows and macos; a `v*` tag
# publishes a GitHub Release. Nothing else ever publishes.
#
# - Pull request touching a release file: a dry-run build on all three OS (unsigned, nothing published).
# - workflow_dispatch on a branch: the same dry run. It needs this file on the default branch.
# - Tag `vX.Y.Z` (a tag push, or a workflow_dispatch on the tag ref): the full run, then `sign-macos` signs and
#   notarises the macOS dmg when the APPLE_* secrets exist, and `host` creates the GitHub Release.
# tag-dispatch: a workflow_dispatch on a refs/tags/v* ref publishes like a tag push.
#   The "Tag release" workflow creates the tag with GITHUB_TOKEN, which does not trigger the tag push, so it
#   dispatches this workflow on the tag instead. The tag is derived from GITHUB_REF in the `mode` step and checked
#   against the version in package.json.
# - `sign-macos` runs on `v*` tag runs only, in the environment `release`. It rebuilds the dmg with electron-builder's
#   own signing (CSC_LINK / CSC_KEY_PASSWORD) and API-key notarisation, then replaces the macOS artifact.
#   With the secrets set, a failed signing fails the job and nothing publishes (fail closed); only the repository
#   variable SQLER_ALLOW_UNSIGNED_FALLBACK == 'true' restores warn-and-ship-unsigned.
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/sign-macos.sh"
      - "electron-builder.yml"
      - "build/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Cancel superseded runs on pull requests only; a branch dispatch run completes (own group per run).
# A run on a tag ref (push or dispatch) shares one group per tag, so two runs on the same tag never overlap.
concurrency:
  group: release-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.mode.outputs.tag }}
      publishing: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') }}
    env:
      PUBLISHING: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: mode
        shell: bash
        run: |
          if [ "$PUBLISHING" = "true" ]; then
            tag=${GITHUB_REF#refs/tags/}
            if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error title=Release tag::the tag is not vX.Y.Z[-pre]"
              exit 1
            fi
            version=$(jq -r .version package.json)
            if [ -z "$version" ] || [ "$version" = "null" ] || [ "${tag#v}" != "$version" ]; then
              echo "::error title=Release tag::the tag does not match the version in package.json"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifacts: dist/*.AppImage
          - os: windows-latest
            artifacts: dist/*.exe
          - os: macos-latest
            artifacts: dist/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # No secret here: this job also runs on pull requests. Signing happens in `sign-macos`.
      - name: macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          PUBLISHING: ${{ needs.plan.outputs.publishing }}
        run: |
          if [ "$PUBLISHING" = "true" ]; then
            echo "::notice title=Unsigned macOS build::signed in sign-macos when the APPLE_* secrets are set"
          else
            echo "::notice title=Unsigned macOS build::dry run; macOS signing runs only in sign-macos on v* tag runs"
          fi

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # Signs and notarises the macOS dmg. The only job that reads the APPLE_* secrets; it runs on a `v*` tag run only,
  # in the environment `release` (deployment rule: tags `v*`). Without the secrets it only prints notices and
  # uploads nothing, so the dmg stays as built.
  sign-macos:
    name: sign (macOS)
    needs:
      - plan
      - build
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only whether the secrets exist is exposed to this step, never their values.
      - id: secrets
        name: Check the Apple secrets
        shell: bash
        env:
          HAVE_SIGN: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAVE_NOTARY: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
        run: |
          sign=false
          notarise=false
          [ "$HAVE_SIGN" = "true" ] && sign=true
          [ "$HAVE_NOTARY" = "true" ] && notarise=true
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarise=$notarise" >> "$GITHUB_OUTPUT"
          if [ "$sign" != "true" ]; then
            echo "::notice title=Unsigned macOS build::no APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD; the macOS dmg stays unsigned"
          fi
          if [ "$notarise" != "true" ]; then
            echo "::notice title=Not notarised::no APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER"
          fi

      - id: sign
        name: Sign and notarise
        if: steps.secrets.outputs.sign == 'true'
        continue-on-error: ${{ vars.SQLER_ALLOW_UNSIGNED_FALLBACK == 'true' }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: sh .github/scripts/sign-macos.sh

      - name: Report failed signing
        if: steps.sign.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=macOS signing failed::the macOS dmg ships unsigned (SQLER_ALLOW_UNSIGNED_FALLBACK)"

      - name: Upload the signed dmg
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: installers-macos-latest
          path: dist/*.dmg
          overwrite: true
          if-no-files-found: error

  host:
    name: host
    needs:
      - plan
      - build
      - sign-macos
    if: ${{ always() && needs.plan.outputs.publishing == 'true' && needs.plan.result == 'success' && needs.build.result == 'success' && needs.sign-macos.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: Create the GitHub Release
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          PRERELEASE=
          case "$TAG" in *-*) PRERELEASE=--prerelease ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes $PRERELEASE installers/*
